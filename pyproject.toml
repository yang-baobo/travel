[project]
name = "shenzhen-travel-route-api"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "asyncpg>=0.31",
  "certifi==2026.7.22",
  "fastapi==0.117.1",
  "ortools==9.15.6755",
  "python-dotenv==1.1.1",
  "uvicorn==0.36.0",
  "websockets==15.0.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[tool.uv]
# OR-Tools lists these data-analysis libraries as general dependencies, but its
# routing solver does not import or use them. Omitting them keeps the serverless
# function under Vercel's uncompressed 500 MB Python bundle limit.
exclude-dependencies = [
  "numpy",
  "pandas",
]
